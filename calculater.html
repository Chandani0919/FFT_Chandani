<!DOCTYPE html>
<html>
<head>
    <title>Grade Calculator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: lightblue;
            padding: 20px;
        }

        .box {
            width: 400px;
            margin: auto;
            background-color: white;
            padding: 20px;
            border: 2px solid blue;
        }

        h2 {
            text-align: center;
            color: blue;
        }

        h3 {
            color: darkblue;
        }

        label {
            display: block;
            margin-top: 8px;
        }

        input {
            width: 100%;
            padding: 8px;
            margin-top: 4px;
            margin-bottom: 10px;
            border: 1px solid gray;
        }

        button {
            padding: 8px 15px;
            background-color: blue;
            color: white;
            border: none;
            cursor: pointer;
            margin-right: 10px;
        }

        button:hover {
            background-color: darkblue;
        }

        #result {
            margin-top: 20px;
            border: 1px solid black;
            padding: 10px;
            background-color: #f2f2f2;
            display: none;
        }

        #status {
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="box">

        <h2>Grade Calculator</h2>

        <h3>Student Information</h3>

        <label>Full Name</label>
        <input type="text" id="name">

        <label>Roll Number</label>
        <input type="text" id="roll">

        <label>Class</label>
        <input type="text" id="studentClass">

        <h3>Subject Marks (Out of 100)</h3>

        <label>Mathematics</label>
        <input type="number" id="math">

        <label>C$LS</label>
        <input type="number" id="csls">

        <label>FFT</label>
        <input type="number" id="fft">

        <label>Python</label>
        <input type="number" id="python">

        <button onclick="calculateGrade()">Calculate</button>
        <button onclick="resetForm()">Reset</button>

        <div id="result">

            <h3>Result</h3>

            <p>Total Marks: <span id="total">0</span></p>

            <p>Average: <span id="average">0</span></p>

            <p>Percentage: <span id="percentage">0%</span></p>

            <p>Grade: <span id="grade">-</span></p>

            <p id="status"></p>

        </div>

    </div>

    <script>

        function calculateGrade() {

            let name = document.getElementById("name").value;

            let math = Number(document.getElementById("math").value);
            let csls = Number(document.getElementById("csls").value);
            let fft = Number(document.getElementById("fft").value);
            let python = Number(document.getElementById("python").value);

            let total = math + csls + fft + python;

            let average = total / 4;

            let percentage = (total / 400) * 100;

            let grade = "";

            if (percentage >= 90) {
                grade = "A";
            }
            else if (percentage >= 80) {
                grade = "B";
            }
            else if (percentage >= 70) {
                grade = "C";
            }
            else if (percentage >= 60) {
                grade = "D";
            }
            else {
                grade = "F";
            }

            document.getElementById("total").innerHTML = total;

            document.getElementById("average").innerHTML =
                average.toFixed(2);

            document.getElementById("percentage").innerHTML =
                percentage.toFixed(2) + "%";

            document.getElementById("grade").innerHTML = grade;

            let status = document.getElementById("status");

            if (percentage >= 40) {
                status.innerHTML = name + " - PASS";
                status.style.color = "green";
            }
            else {
                status.innerHTML = name + " - FAIL";
                status.style.color = "red";
            }

            document.getElementById("result").style.display = "block";
        }

        function resetForm() {

            document.getElementById("name").value = "";
            document.getElementById("roll").value = "";
            document.getElementById("studentClass").value = "";

            document.getElementById("math").value = "";
            document.getElementById("csls").value = "";
            document.getElementById("fft").value = "";
            document.getElementById("python").value = "";

            document.getElementById("result").style.display = "none";
        }

    </script>

</body>
</html>
