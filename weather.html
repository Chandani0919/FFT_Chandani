<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather Information App</title>

    <link rel="stylesheet" href="weather.css">
</head>

<body>

<div class="container">

    <h1>🌤 Weather Dashboard</h1>

    <div class="search-section">
        <input
            type="text"
            id="city"
            placeholder="Enter city name">
        <button onclick="getWeather()">Search</button>
    </div>

    <p id="loading"></p>

    <div id="weather">

        <div class="top-section">
            <div class="location">
                <h2 id="cityName"></h2>
            </div>

            <div class="icon-box">
                <img id="weatherIcon" src="./icon.png" alt="Weather Icon">
            </div>
        </div>

        <div class="dashboard-grid">

            <div class="weather-card">
                <h3>🌡 Temperature</h3>
                <p id="temperature"></p>
            </div>

            <div class="weather-card">
                <h3>💧 Humidity</h3>
                <p id="humidity"></p>
            </div>

            <div class="weather-card">
                <h3>🌬 Wind Speed</h3>
                <p id="wind"></p>
            </div>

            <div class="weather-card">
                <h3>☁ Condition</h3>
                <p id="condition"></p>
            </div>

        </div>

    </div>

    <p id="error"></p>
</div>

    <script src="weather.js"></script>

</body>

</html>
